<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GrammarHero 10 - Englisch Grammatik & Verb Trainer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>

    <div class="app-container">
        <header class="app-header">
            <div class="logo">
                <i class="fa-solid fa-graduation-cap logo-icon"></i>
                <span class="logo-text">Grammar<span class="highlight">Hero</span> <span class="badge">Klasse 10</span></span>
            </div>
            
            <nav class="app-nav">
                <button class="nav-btn active" id="btn-tab-trainer" onclick="switchTab('trainer')">
                    <i class="fa-solid fa-gamepad"></i> Übungs-Arena
                </button>
                <button class="nav-btn" id="btn-tab-grammar" onclick="switchTab('grammar')">
                    <i class="fa-solid fa-book-open"></i> Grammatik-Bibliothek
                </button>
            </nav>

            <div class="header-stats">
                <div class="stat-badge">
                    <i class="fa-solid fa-fire text-orange"></i>
                    <span>Streak: <strong id="global-streak">0</strong></span>
                </div>
                <div class="stat-badge">
                    <i class="fa-solid fa-star text-yellow"></i>
                    <span>Punkte: <strong id="global-points">0</strong></span>
                </div>
            </div>
        </header>

        <main class="app-main">
            
            <section id="tab-trainer" class="tab-content active">
                <div class="trainer-layout">
                    
                    <div class="card glass-card main-trainer-card">
                        <div class="card-header">
                            <div class="title-group">
                                <span class="subtitle-tag" id="current-tense-badge">Simple Present</span>
                                <h2>Satz-Trainer</h2>
                            </div>
                            <div class="progress-container">
                                <span class="progress-text" id="sentence-progress">Satz 1 von 10</span>
                                <div class="progress-bar-bg">
                                    <div class="progress-bar-fill" id="sentence-progress-bar" style="width: 10%"></div>
                                </div>
                            </div>
                        </div>

                        <div class="card-body">
                            <div class="instruction-box" id="instruction-box">
                                <div class="instruction-step active" id="step-signal">
                                    <i class="fa-solid fa-magnifying-glass instruction-icon text-cyan"></i>
                                    <span><strong>Schritt 1:</strong> Finde und markiere das <strong>Signalwort</strong>!</span>
                                </div>
                                <div class="instruction-step" id="step-gap">
                                    <i class="fa-solid fa-keyboard instruction-icon text-purple"></i>
                                    <span><strong>Schritt 2:</strong> Hervorragend! Fülle nun die Lücke aus.</span>
                                </div>
                            </div>

                            <div class="sentence-display-area" id="sentence-area" role="group" aria-label="Satz-Aufgabenbereich">
                            </div>

                            <div class="feedback-drawer" id="feedback-drawer" aria-live="polite">
                                <div class="feedback-header">
                                    <div class="feedback-status" id="feedback-status"></div>
                                    <span class="tense-tag" id="feedback-tense"></span>
                                </div>
                                <div class="feedback-body">
                                    <div class="correct-form-alert">
                                        <span>Korrekt wäre: </span><strong id="feedback-correct-answer"></strong>
                                    </div>
                                    <p class="explanation-text" id="feedback-explanation"></p>
                                </div>
                            </div>
                        </div>

                        <div class="card-footer">
                            <button class="btn btn-secondary" id="btn-hint" onclick="showSentenceHint()">
                                <i class="fa-solid fa-lightbulb"></i> Tipp
                            </button>
                            <button class="btn btn-primary" id="btn-action" onclick="handleSentenceAction()" disabled>
                                <i class="fa-solid fa-lock"></i> Bitte Signalwort wählen
                            </button>
                        </div>
                    </div>

                    <div class="trainer-sidebar">
                        <div class="card glass-card widget-verbs">
                            <div class="widget-header">
                                <h3><i class="fa-solid fa-bolt text-purple"></i> Irregular Verbs</h3>
                                <div class="widget-streak" title="Unregelmäßige Verben Streak">
                                    <i class="fa-solid fa-fire text-orange"></i> <span id="verbs-streak">0</span>
                                </div>
                            </div>
                            <div class="widget-body">
                                <p class="widget-desc">Gib die 3 Stammformen ein:</p>
                                <div class="verb-target-word" id="verb-german-target">---</div>
                                <form id="verbs-widget-form" onsubmit="event.preventDefault(); checkWidgetVerbs();">
                                    <div class="input-wrapper"><input type="text" id="widget-inf" autocomplete="off" placeholder="Infinitive" required></div>
                                    <div class="input-wrapper"><input type="text" id="widget-sp" autocomplete="off" placeholder="Simple Past" required></div>
                                    <div class="input-wrapper"><input type="text" id="widget-pp" autocomplete="off" placeholder="Past Participle" required></div>
                                    <button type="submit" class="btn btn-accent btn-full" id="btn-widget-check">Prüfen</button>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            </section>

            <section id="tab-grammar" class="tab-content">
            </section>

        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
